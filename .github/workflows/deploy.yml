name: Ultra-Fast Incremental Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 이력을 가져와 파일 변경 추적 성능 향상

      # 1. 배포 상태 파일 캐싱 (가장 중요한 최적화)
      # 지난 배포 때 어떤 파일을 올렸는지 기록한 파일을 보관하여 다음 배포 때 재사용합니다.
      - name: Cache FTP Sync State
        uses: actions/cache@v4
        with:
          path: .ftp-deploy-sync-state.json
          key: ${{ runner.os }}-ftp-state-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ftp-state-

      # 2. PHP 및 Composer 설정 (캐싱 포함)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install Composer
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # 3. Node.js 및 에셋 빌드 (캐싱 포함)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache NPM Dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install NPM & Build
        run: |
          npm install
          npm run build

      # 4. 배포 패키지 구성
      - name: Prepare Deployment Files
        run: |
          rm -rf deploy
          mkdir -p deploy
          rsync -av --exclude='deploy' . ./deploy/
          rm -rf ./deploy/node_modules ./deploy/tests ./deploy/.git ./deploy/.github
          mkdir -p ./deploy/storage/framework/{cache/data,sessions,views}
          mkdir -p ./deploy/storage/logs

      # 5. 초고속 증분 전송 (변경된 파일만!)
      - name: Sync Changed Files Only
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ./
          # 'dry-run: false'가 기본값이며, 자동으로 파일 비교 후 전송합니다.
          # 전송 후 .ftp-deploy-sync-state.json 파일이 로컬에 생성됩니다.
          exclude: |
            **/.git*
            **/.git*/**
            .env
