name: Optimized Deploy (FTP + SSH)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Node.js 빌드 (에셋 빌드 결과물만 전송하기 위함)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Assets (Vite)
        run: |
          npm install
          npm run build

      # 2. 배포 패키지 구성 (vendor, node_modules 제외)
      - name: Prepare Deployment Files
        run: |
          rm -rf deploy
          mkdir -p deploy
          rsync -av --exclude='deploy' \
                    --exclude='vendor' \
                    --exclude='node_modules' \
                    --exclude='tests' \
                    --exclude='.git' \
                    --exclude='.github' \
                    . ./deploy/

          # 필수 폴더 구조 생성 (서버에서 에러 방지)
          mkdir -p ./deploy/storage/framework/{cache/data,sessions,views}
          mkdir -p ./deploy/storage/logs

      # 3. 변경된 소스코드 및 빌드된 에셋만 FTP 전송 (매우 빠름)
      - name: Sync Files to Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .env

      # 4. SSH를 통해 서버에서 직접 Composer 설치 및 캐시 최적화
      - name: Post-Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            cd domains/kkyungvelyy.com
            # 서버에서 직접 라이브러리 설치 (FTP보다 훨씬 빠름)
            composer install --no-dev --optimize-autoloader --no-interaction
            # 라라벨 최적화 명령어
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
