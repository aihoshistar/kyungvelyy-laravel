name: Optimized Deploy (FTP + SSH)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Assets (Vite)
        run: |
          npm install
          npm run build

      - name: Prepare Deployment Files
        run: |
          rm -rf deploy
          mkdir -p deploy
          rsync -av --exclude='deploy' \
                    --exclude='vendor' \
                    --exclude='node_modules' \
                    --exclude='tests' \
                    --exclude='.git' \
                    --exclude='.github' \
                    . ./deploy/

          mkdir -p ./deploy/storage/framework/{cache/data,sessions,views}
          mkdir -p ./deploy/storage/logs

      - name: Sync Files to Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          # [핵심 수정] FTP 계정의 기본 루트 경로에 그대로 배포하도록 './' 로 설정합니다.
          server-dir: ../
          exclude: |
            **/.git*
            **/.git*/**
            .env

