name: Optimized Deploy (FTP + SSH)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Assets (Vite)
        run: |
          npm install
          npm run build

      - name: Prepare Deployment Files
        run: |
          rm -rf deploy
          mkdir -p deploy
          rsync -av --exclude='deploy' \
                    --exclude='vendor' \
                    --exclude='node_modules' \
                    --exclude='tests' \
                    --exclude='.git' \
                    --exclude='.github' \
                    . ./deploy/

          mkdir -p ./deploy/storage/framework/{cache/data,sessions,views}
          mkdir -p ./deploy/storage/logs

      - name: Sync Files to Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          # [수정] 서버의 트리 구조에 맞춰 public_html 폴더로 전송
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .env

      - name: Post-Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            # [수정] 이동 경로를 public_html로 변경
            cd domains/kkyungvelyy.com/public_html

            # [해결책] --no-scripts를 추가하여 설치 단계와 스크립트 실행 단계를 분리합니다.
            # 기존 vendor가 꼬여있을 수 있으므로 안전을 위해 삭제 후 재설치를 권장할 수 있으나,
            # 속도를 위해 우선 스크립트 실행만 억제합니다.
            composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

            # 수동으로 패키지 발견 및 캐시 최적화 실행
            php artisan package:discover --ansi
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
