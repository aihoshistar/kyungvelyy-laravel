name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  laravel-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. PHP 환경 설정
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          coverage: none

      # 3. Composer 의존성 설치 (운영 환경 최적화)
      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      # 4. Node.js 환경 설정 및 에셋 빌드 (Vite)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies & Build
        run: |
          npm install
          npm run build

      # 5. 배포용 파일 정리 (rsync를 사용하여 자기 복사 방지 및 구조 최적화)
      - name: Prepare Deployment Files
        run: |
          rm -rf deploy
          mkdir -p deploy

          # 'deploy' 폴더 자체를 제외하고 모든 파일을 './deploy/'로 복사
          rsync -av --exclude='deploy' . ./deploy/

          # 불필요한 파일 삭제
          rm -rf ./deploy/node_modules
          rm -rf ./deploy/tests
          rm -rf ./deploy/.git
          rm -rf ./deploy/.github
          rm -rf ./deploy/storage/logs/*.log

          # 필수 디렉토리 구조 강제 생성
          mkdir -p ./deploy/storage/framework/cache/data
          mkdir -p ./deploy/storage/framework/app/cache
          mkdir -p ./deploy/storage/framework/sessions
          mkdir -p ./deploy/storage/framework/views
          mkdir -p ./deploy/storage/logs

      # 6. FTP를 통한 파일 전송 (서버 정보 필수 입력)
      - name: Sync Files to Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # GitHub Secrets에 등록한 이름과 정확히 일치해야 합니다.
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # 이전 단계에서 준비한 배포용 폴더 경로
          local-dir: ./deploy/
          # Hostinger FTP 계정 생성 시 지정한 경로 내부의 루트
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            storage/*.zmdi
